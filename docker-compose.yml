services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: narrator-ai-web:latest
    container_name: narrator-ai-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      APP_ENV: PROD
      HOSTNAME: 0.0.0.0
      PORT: "5000"
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/', r => process.exit(r.statusCode >= 500 ? 1 : 0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
