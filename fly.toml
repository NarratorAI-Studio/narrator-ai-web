app = "your-frontend-prod"
primary_region = "sin"

[build]
dockerfile = "Dockerfile"

[deploy]
strategy = "rolling"

[env]
NEXT_PUBLIC_HARD_PRICE_KILL_SWITCH = "false"
NEXT_PUBLIC_HARD_PRICE_ROLLOUT_PERCENT = "0"
# Backend orchestrator  cutover: when "1", sync/route.ts
# stops calling triggerNextStep for run_auto=1 tasks; backend orchestrator
# owns auto-advance. Rollback = set to "0" + redeploy (or `fly secrets set`).
NEXT_PUBLIC_BACKEND_ORCHESTRATOR_ON = "1"

[http_service]
auto_start_machines = true
auto_stop_machines = "stop"
force_https = true
internal_port = 5_000
min_machines_running = 1

  [[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"

  [http_service.http_options]
  idle_timeout = 300

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 1_024
